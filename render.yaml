services:
  - type: web
    name: movie-recommender
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python build_model.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
